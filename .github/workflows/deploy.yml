# Автодеплой сайта на GitHub Pages при каждом пуше в main.
# Пока нет package.json (вёрстка не начата) — публикуется заглушка из /placeholder.
# Когда появится Vite-проект — собирается и публикуется /dist.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect project
        id: detect
        run: |
          if [ -f package.json ]; then echo "dir=dist" >> "$GITHUB_OUTPUT"; echo "node=true" >> "$GITHUB_OUTPUT";
          else echo "dir=placeholder" >> "$GITHUB_OUTPUT"; echo "node=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.node == 'true'
        with:
          node-version: 22
          cache: npm

      # base берётся из настроек Pages: /New-Year/ на github.io, / после подключения ngperm.ru
      - name: Build
        if: steps.detect.outputs.node == 'true'
        run: |
          npm ci
          npx vite build --base="${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.detect.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
