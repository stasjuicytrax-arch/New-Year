<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Главная новогодняя ночь 2027 — скоро</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#00061B; --text:#D7E1ED; --muted:#ABC3E4; --line:#598BFB; }
  * { box-sizing:border-box; margin:0 }
  body { min-height:100svh; display:grid; place-items:center; padding:24px; text-align:center;
         background:radial-gradient(120% 80% at 50% -10%, #12317A 0%, #00102E 45%, #000208 100%);
         color:var(--text); font-family:system-ui, sans-serif; }
  h1 { font-family:Georgia, serif; font-weight:700; text-transform:uppercase; line-height:.95;
       font-size:clamp(40px, 9vw, 120px);
       background:linear-gradient(180deg,#fff 0%,#EAF0F8 30%,#9AA6C4 48%,#5E6886 52%,#E6ECF5 64%,#8591B2 100%);
       -webkit-background-clip:text; background-clip:text; color:transparent; }
  p { margin-top:24px; color:var(--muted); letter-spacing:.28em; text-transform:uppercase; font-size:13px }
  .line { width:120px; height:1px; background:var(--line); margin:28px auto 0; box-shadow:0 0 12px var(--line) }
</style>
</head>
<body>
  <main>
    <h1>Главная<br>новогодняя<br>ночь 2027</h1>
    <div class="line"></div>
    <p>31 декабря · White Hall · Пермь<br><br>Сайт в разработке</p>
  </main>
</body>
</html>
